<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banque Misr • Digital Onboarding</title>

  <!-- Simple Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #811838;
      overflow: hidden;
    }

    #splash-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #811838, #5A1127);
      color: white;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    .splash-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .container {
      text-align: center;
      padding: 20px;
      max-width: 400px;
    }

    /* Logo */
    .logo {
      width: 90px;
      height: 90px;
      background: white;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
    }

    .logo span {
      font-size: 36px;
      font-weight: 700;
      color: #811838;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 4px;
      color: white;
    }

    p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 40px;
    }

    /* Simple progress bar */
    .progress {
      width: 280px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      margin: 0 auto 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: white;
      border-radius: 10px;
      transition: width 0.2s ease;
    }

    .status {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 8px;
    }

    .percentage {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
    }

    /* Simple loading dots */
    .dots {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); background: rgba(255, 255, 255, 0.4); }
      50% { transform: scale(1.2); background: white; }
    }

    .footer {
      margin-top: 40px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
<div id="splash-screen">
  <div class="container">
    <!-- Simple Logo -->
    <div class="logo">
      <span>BM</span>
    </div>

    <h1>Banque Misr</h1>
    <p>Digital Onboarding</p>

    <!-- Simple Progress -->
    <div class="progress">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="status" id="statusText">Initializing...</div>
    <div class="percentage" id="percentageText">0%</div>

    <!-- Simple Loading Dots -->
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="footer">NTB Onboarding • Q1 2026</div>
  </div>
</div>

<script src="flutter_bootstrap.js" async></script>

<script>
  (function() {
    let progress = 0;
    let engineReady = false;
    let splashHidden = false;

    const splash = document.getElementById('splash-screen');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    const percentageText = document.getElementById('percentageText');

    function updateProgress(value, status) {
      if (splashHidden) return;

      progress = Math.min(value, 100);
      progressFill.style.width = progress + '%';
      percentageText.innerText = progress + '%';
      if (status) statusText.innerText = status;

      if (progress >= 100) {
        setTimeout(() => {
          splash.classList.add('splash-hidden');
          setTimeout(() => {
            splash.style.display = 'none';
            splashHidden = true;
          }, 400);
        }, 300);
      }
    }

    // Simple loading sequence
    window.flutterEngineReady = () => updateProgress(30, 'Loading engine...');
    window.roadmapReady = () => updateProgress(60, 'Loading roadmap...');
    window.blockersReady = () => updateProgress(80, 'Loading blockers...');
    window.dashboardReady = () => updateProgress(100, 'Ready!');

    // Auto progress for development
    setTimeout(() => window.flutterEngineReady?.(), 800);
    setTimeout(() => window.roadmapReady?.(), 2000);
    setTimeout(() => window.blockersReady?.(), 3500);
    setTimeout(() => window.dashboardReady?.(), 4500);

    // Safety timeout
    setTimeout(() => {
      if (!splashHidden) updateProgress(100, 'Ready!');
    }, 8000);
  })();
</script>
</body>
</html>
