<!DOCTYPE html>
<html>
<head>
  <!-- IMPORTANT: Adjust base href to match your deployment path -->
  <base href="/RDO/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Removed viewport meta → Flutter injects its own (warning gone) -->

  <title>Banque Misr • Digital Onboarding</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #811838;
      overflow: hidden;
      height: 100vh;
    }

    #splash-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #811838, #5A1127);
      color: white;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    .splash-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .container {
      text-align: center;
      padding: 20px;
      max-width: 400px;
    }

    .logo {
      width: 90px;
      height: 90px;
      background: white;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
    }

    .logo span {
      font-size: 36px;
      font-weight: 700;
      color: #811838;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 4px;
      color: white;
    }

    p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 40px;
    }

    .progress {
      width: 280px;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      margin: 0 auto 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: white;
      border-radius: 10px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .status {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 8px;
    }

    .percentage {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
    }

    .dots {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      animation: pulse 1.4s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1);   background: rgba(255, 255, 255, 0.4); }
      50%      { transform: scale(1.35); background: white; }
    }

    .footer {
      margin-top: 48px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
<div id="splash-screen">
  <div class="container">
    <div class="logo">
      <span>BM</span>
    </div>

    <h1>Banque Misr</h1>
    <p>Digital Onboarding</p>

    <div class="progress">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="status" id="statusText" role="status" aria-live="polite">Initializing...</div>
    <div class="percentage" id="percentageText">0%</div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="footer">NTB Onboarding • Q1 2026</div>
  </div>
</div>

<script src="flutter_bootstrap.js" async></script>

<script>
  (function () {
    let progress = 0;
    let splashHidden = false;

    const splash = document.getElementById('splash-screen');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    const percentageText = document.getElementById('percentageText');

    function updateProgress(value, status) {
      if (splashHidden) return;

      progress = Math.min(Math.max(value, progress), 100); // never go backwards
      progressFill.style.width = progress + '%';
      percentageText.textContent = Math.round(progress) + '%';

      if (status) {
        statusText.textContent = status;
      }

      if (progress >= 100) {
        setTimeout(() => {
          splash.classList.add('splash-hidden');
          setTimeout(() => {
            splash.style.display = 'none';
            splashHidden = true;
          }, 500);
        }, 400);
      }
    }

    // ── Real Flutter loading events ──
    window.addEventListener('flutter-first-frame', () => {
      updateProgress(100, 'Ready!');
    });

    // Optional: more granular stages (if _flutter.loader is available)
    if (window._flutter && window._flutter.loader) {
      const loader = window._flutter.loader;

      loader.didCreateEngine?.().then(() => {
        updateProgress(30, 'Engine initialized');
      });

      loader.didInitializeEngine?.().then(() => {
        updateProgress(65, 'Preparing interface');
      });
    }

    // Start with some immediate feedback
    updateProgress(10, 'Starting application...');

    // Fallback: force complete after 15 seconds (very slow connections)
    setTimeout(() => {
      if (!splashHidden) {
        updateProgress(100, 'Ready!');
      }
    }, 15000);
  })();
</script>
</body>
</html>
